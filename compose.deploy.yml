# 배포 전용 오버레이 — TLS(Let's Encrypt)를 compose.yml 위에 덧입힌다.
# 공개 배포: docker compose -f compose.yml -f compose.deploy.yml up -d
# 로컬 개발: docker compose up (TLS 없음, 이 파일을 쓰지 않는다)
services:
  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${SEVI_ACME_EMAIL:?SEVI_ACME_EMAIL 미설정 — Let's Encrypt 등록 이메일을 설정하세요}
      - --certificatesresolvers.letsencrypt.acme.storage=${SEVI_ACME_STORAGE:-/letsencrypt/acme.json}
    ports:
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt

  backend:
    labels:
      - traefik.http.routers.sevi.rule=Host(`${SEVI_DOMAIN:?SEVI_DOMAIN 미설정 — 공개 도메인을 설정하세요}`)
      - traefik.http.routers.sevi.entrypoints=websecure
      - traefik.http.routers.sevi.tls.certresolver=letsencrypt

volumes:
  letsencrypt:
